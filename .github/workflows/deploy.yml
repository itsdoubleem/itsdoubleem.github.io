name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Once a day, so an app's update notice with an `until:` date comes down within a day
  # of it (src/release.ts). The site is static — a notice past its date is only gone once
  # something rebuilds the page. GitHub pauses scheduled runs after 60 days with no
  # commits; if notices ever stop expiring, that is the first thing to look at.
  schedule:
    - cron: '17 0 * * *'

# No permissions by default. Each job asks for exactly what it needs below, so the job
# that runs third-party code (npm ci, which executes package lifecycle scripts) holds no
# token that can publish anything.
permissions: {}

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Read the repo, write an artifact. That is all a build needs; it deliberately does
    # NOT get pages:write or id-token:write — those live in the deploy job, which runs
    # nothing but the deploy action.
    permissions:
      contents: read
    steps:
      # Actions are pinned to a commit, not a tag. A tag is a movable pointer: whoever
      # controls the action's repo can repoint v4 at new code, and it would run here on
      # the next push with whatever permissions this job holds. A SHA cannot be moved.
      # To update one: gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
      # (if .object.type is "tag", dereference it with git/tags/<sha>).
      #
      # The repository also *requires* SHA pinning (Settings > Actions), and that rule
      # reaches inside composite actions. upload-pages-artifact v3 calls
      # actions/upload-artifact@v4 — a bare tag — so pinning v3 was not enough and the
      # deploy was refused before it ran. v5.0.0 pins its own inner dependency, which is
      # why these two are on v5 rather than the v3/v4 pair the Pages docs still show.
      # If a future version un-pins something, the run fails at "Set up job" naming the
      # offending action; read that line rather than turning the requirement off.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` installs from the lockfile only — it refuses to resolve a version the
      # lockfile does not name, which is the reason this is not `npm install`. The
      # --ignore-scripts flag drops the other half: no dependency gets to run code at
      # install time. Astro needs no install script to build.
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Every APK matches its release: block and the hash in README.md, no hash or size
      # is typed into a page by hand, and every #link in the built pages has somewhere to
      # land. Needs no network. A failure here stops the deploy.
      - run: npm run check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
