name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Two schedules. GitHub pauses both after 60 days with no commits; if pills stop expiring
  # or app releases stop arriving, look there first.
  #
  # 00:17 UTC (09:17 KST), daily: a full rebuild, so an app's "New" pill comes down within a
  # day of its seventh day, and an update notice within a day of its last (src/release.ts).
  # The site is static — either is only gone once something rebuilds the page.
  #
  # :47 past every hour: the sync job asks each app's repo for its Latest release
  # (tools/sync-apps.mjs). The site is rebuilt only if that changed something.
  schedule:
    - cron: '17 0 * * *'
    - cron: '47 * * * *'

# No permissions by default. Each job asks for exactly what it needs below, so the job
# that runs third-party code (npm ci, which executes package lifecycle scripts) holds no
# token that can publish anything.
permissions: {}

jobs:
  # Brings each app's download up to its Latest GitHub Release and commits the result to
  # main. Not on a push: a push is a person's change, already in the tree.
  #
  # It holds contents:write, and so it never runs `npm ci` — no dependency's code runs
  # beside the token. The sync needs only Node, unzip and the Android SDK's aapt2 and
  # apksigner, all on the runner. The checkout keeps no credentials on disk; the token
  # appears in the one step that pushes. A push made with this token starts no other
  # workflow, which is why this run's own build below picks the new commit up from main.
  sync:
    if: github.event_name != 'push'
    # One sync at a time, so two never push the same update.
    concurrency:
      group: sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # main as it is now, not the commit the schedule fired on: a run that waited behind
      # another would otherwise sync onto an old tree and have its push refused.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Sync app releases
        run: node tools/sync-apps.mjs --message-file "$RUNNER_TEMP/sync-message"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Authored and committed as the owner's noreply address, so the repository keeps one
      # contributor (CLAUDE.md, hard rule 6) — not github-actions[bot]. No trailers.
      # Runs even when one app failed, so the apps that synced are still published. The
      # job stays red, which is the signal to read the failed one's ::error:: line.
      - id: commit
        name: Commit and push
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name itsdoubleem
          git config user.email 328792799+itsdoubleem@users.noreply.github.com
          git add -A
          git commit -q -F "$RUNNER_TEMP/sync-message"
          git pull -q --rebase "https://github.com/${GITHUB_REPOSITORY}.git" main
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    # On a push or by hand, always. On the daily schedule, always — that is the rebuild that
    # retires pills. On the hourly one, only when the sync committed something. A failed
    # sync does not stop the daily rebuild of what is already on main.
    if: >-
      !cancelled() && (
        github.event_name != 'schedule' ||
        github.event.schedule == '17 0 * * *' ||
        needs.sync.outputs.changed == 'true'
      )
    runs-on: ubuntu-latest
    # Read the repo, write an artifact. That is all a build needs; it deliberately does
    # NOT get pages:write or id-token:write — those live in the deploy job, which runs
    # nothing but the deploy action.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.built.outputs.sha }}
    steps:
      # Actions are pinned to a commit, not a tag. A tag is a movable pointer: whoever
      # controls the action's repo can repoint v4 at new code, and it would run here on
      # the next push with whatever permissions this job holds. A SHA cannot be moved.
      # To update one: gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
      # (if .object.type is "tag", dereference it with git/tags/<sha>).
      #
      # The repository also *requires* SHA pinning (Settings > Actions), and that rule
      # reaches inside composite actions. upload-pages-artifact v3 calls
      # actions/upload-artifact@v4 — a bare tag — so pinning v3 was not enough and the
      # deploy was refused before it ran. v5.0.0 pins its own inner dependency, which is
      # why these two are on v5 rather than the v3/v4 pair the Pages docs still show.
      # If a future version un-pins something, the run fails at "Set up job" naming the
      # offending action; read that line rather than turning the requirement off.
      #
      # It builds main as it is when the job starts, whatever started the run — not the
      # commit the run was queued for. Two runs close together then never build an older
      # tree than they could; the deploy job below refuses a build main has since moved past.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` installs from the lockfile only — it refuses to resolve a version the
      # lockfile does not name, which is the reason this is not `npm install`. The
      # --ignore-scripts flag drops the other half: no dependency gets to run code at
      # install time. Astro needs no install script to build.
      - run: npm ci --ignore-scripts
      # Node's own test runner on tests/*.test.ts. It reads TypeScript directly, which
      # Node 22 does by default from 22.18 — setup-node's `22` resolves to a later one.
      # A failure here stops the deploy.
      - run: npm test
      - run: npm run build
      # Every APK matches its release: block and the hash in README.md, no hash or size
      # is typed into a page by hand, and every #link in the built pages has somewhere to
      # land. Needs no network. A failure here stops the deploy.
      - run: npm run check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    # The concurrency group sits here, on the deploy alone, and not on the whole workflow.
    # GitHub cancels a *pending* run in a group when a newer one queues; at workflow level an
    # hourly run could cancel a push's run and then, having synced nothing, build nothing —
    # the push would wait for the daily rebuild. A running deploy is still let finish.
    #
    # Builds from different runs finish in any order, so the first step asks GitHub what
    # main is now and deploys only if this build is of it. A build main has moved past is
    # dropped: whatever moved main — a push, or a sync's commit — started a run of its own
    # that builds the newer tree. So the live site never goes back to an older commit.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Said out loud: on a push the sync job is skipped, and a job downstream of a skipped
    # one is skipped too unless its condition says otherwise.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: current
        env:
          BUILT: ${{ needs.build.outputs.sha }}
        run: |
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$head" = "$BUILT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Built $BUILT, but main is now $head — leaving the deploy to the run that builds it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
